worker_processes auto;

events {
    worker_connections 4096;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # $uri, not $request: query strings carry secrets (email verification and unsubscribe tokens, the SignalR
    # access_token), so they never reach the access log.
    log_format upstream '$remote_addr "$request_method $uri" $status upstream=$upstream_addr rt=$request_time';
    access_log /dev/stdout upstream;
    error_log /dev/stderr warn;

    upstream chathub_api {
        zone chathub_api 64k;
        server api:8080 resolve;
        keepalive 32;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    server {
        listen 8080;
        server_tokens off;
        client_max_body_size 30m;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        location /hubs/ {
            proxy_pass http://chathub_api;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location / {
            proxy_pass http://chathub_api;
        }
    }
}
