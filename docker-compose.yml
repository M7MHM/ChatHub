name: chathub

x-db-connection: &db-connection "Host=postgres;Port=5432;Database=${POSTGRES_DB:?set POSTGRES_DB in .env};Username=${POSTGRES_USER:?set POSTGRES_USER in .env};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env};Gss Encryption Mode=Disable"

# Connection budget: api replicas × DB_MAX_POOL_SIZE + headroom <= POSTGRES_MAX_CONNECTIONS, where headroom covers the
# migrator, the seeder, psql and a replica being recreated. Defaults: 2 × 30 = 60 of 100. See docs/PERFORMANCE.md.
x-db-api-connection: &db-api-connection "Host=postgres;Port=5432;Database=${POSTGRES_DB:?set POSTGRES_DB in .env};Username=${POSTGRES_USER:?set POSTGRES_USER in .env};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env};Gss Encryption Mode=Disable;Maximum Pool Size=${DB_MAX_POOL_SIZE:-30};Max Auto Prepare=${DB_MAX_AUTO_PREPARE:-50}"

networks:
  chathub:
    ipam:
      config:
        - subnet: ${CHATHUB_SUBNET:-172.29.0.0/24}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-100}"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - chathub-pgdata:/var/lib/postgresql/data
    networks: [chathub]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [chathub]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrator:
    build:
      context: .
      target: migrator
    command: ["--connection", *db-connection]
    networks: [chathub]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seeder:
    build:
      context: .
      target: seeder
    profiles: ["seed"]
    environment:
      ConnectionStrings__DefaultConnection: *db-connection
    networks: [chathub]
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      target: api
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: *db-api-connection
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      Https__RedirectEnabled: "false"
      ForwardedHeaders__KnownNetworks__0: ${CHATHUB_SUBNET:-172.29.0.0/24}
      Diagnostics__ExposeInstanceId: "true"
    deploy:
      replicas: 2
    networks: [chathub]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    volumes:
      - chathub-storage:/app/storage
    restart: unless-stopped

  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    networks: [chathub]
    depends_on:
      api:
        condition: service_started

volumes:
  chathub-pgdata:
  chathub-storage:
