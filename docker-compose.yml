services:
  postgres:
    image: postgres:17
    container_name: chathub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chathub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - chathub-pgdata:/var/lib/postgresql/data

volumes:
  chathub-pgdata:
