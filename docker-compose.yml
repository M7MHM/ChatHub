name: chathub

x-db-connection: &db-connection "Host=postgres;Port=5432;Database=${POSTGRES_DB:?set POSTGRES_DB in .env};Username=${POSTGRES_USER:?set POSTGRES_USER in .env};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env};Gss Encryption Mode=Disable"

# Connection budget: api replicas × DB_MAX_POOL_SIZE + NOTIFICATIONS_DB_MAX_POOL_SIZE + headroom <= POSTGRES_MAX_CONNECTIONS,
# where headroom covers the migrators, the seeder, psql and a replica being recreated. Defaults: 2 × 30 + 10 = 70 of 100.
# See docs/PERFORMANCE.md.
x-db-api-connection: &db-api-connection "Host=postgres;Port=5432;Database=${POSTGRES_DB:?set POSTGRES_DB in .env};Username=${POSTGRES_USER:?set POSTGRES_USER in .env};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env};Gss Encryption Mode=Disable;Maximum Pool Size=${DB_MAX_POOL_SIZE:-30};Max Auto Prepare=${DB_MAX_AUTO_PREPARE:-50}"

# The notification service has its own database on the same PostgreSQL server; its migrator creates it on first run.
x-notifications-db-connection: &notifications-db-connection "Host=postgres;Port=5432;Database=${NOTIFICATIONS_DB:-chathub_notifications};Username=${POSTGRES_USER:?set POSTGRES_USER in .env};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env};Gss Encryption Mode=Disable;Maximum Pool Size=${NOTIFICATIONS_DB_MAX_POOL_SIZE:-10}"

networks:
  chathub:
    ipam:
      config:
        - subnet: ${CHATHUB_SUBNET:-172.29.0.0/24}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-100}"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - chathub-pgdata:/var/lib/postgresql/data
    networks: [chathub]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [chathub]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-chathub}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-chathub}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - chathub-rabbitmq:/var/lib/rabbitmq
    networks: [chathub]
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/5672"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  migrator:
    build:
      context: .
      target: migrator
    command: ["--connection", *db-connection]
    networks: [chathub]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seeder:
    build:
      context: .
      target: seeder
    profiles: ["seed"]
    environment:
      ConnectionStrings__DefaultConnection: *db-connection
    networks: [chathub]
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      target: api
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: *db-api-connection
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      Https__RedirectEnabled: "false"
      ForwardedHeaders__KnownNetworks__0: ${CHATHUB_SUBNET:-172.29.0.0/24}
      Diagnostics__ExposeInstanceId: "true"
      Messaging__Enabled: ${MESSAGING_ENABLED:-true}
      Messaging__Host: rabbitmq
      Messaging__User: ${RABBITMQ_USER:-chathub}
      Messaging__Password: ${RABBITMQ_PASSWORD:-chathub}
    deploy:
      replicas: 2
    networks: [chathub]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      migrator:
        condition: service_completed_successfully
    volumes:
      - chathub-storage:/app/storage
    restart: unless-stopped

  notifications-migrator:
    build:
      context: .
      target: notifications-migrator
    command: ["--connection", *notifications-db-connection]
    networks: [chathub]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  notifications:
    build:
      context: .
      target: notifications
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Notifications: *notifications-db-connection
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER:-chathub}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-chathub}
      Smtp__Host: ${SMTP_HOST:-mailpit}
      Smtp__Port: ${SMTP_PORT:-1025}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__Security: ${SMTP_SECURITY:-None}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-notifications@chathub.local}
      Smtp__FromName: ${SMTP_FROM_NAME:-ChatHub}
      Notifications__DigestDelaySeconds: ${NOTIFICATIONS_DIGEST_DELAY_SECONDS:-120}
      Notifications__CooldownMinutes: ${NOTIFICATIONS_COOLDOWN_MINUTES:-15}
      Notifications__IncludePreview: ${NOTIFICATIONS_INCLUDE_PREVIEW:-true}
      Notifications__AppBaseUrl: ${NOTIFICATIONS_APP_BASE_URL:-http://localhost:3000}
    networks: [chathub]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      notifications-migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks: [chathub]

  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    networks: [chathub]
    depends_on:
      api:
        condition: service_started

volumes:
  chathub-pgdata:
  chathub-storage:
  chathub-rabbitmq:
