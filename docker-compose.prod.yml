# Production stack for one small server (docs/DEPLOYMENT.md). Standalone: do not combine with docker-compose.yml.
# Always run it through deploy/compose.sh (or deploy/deploy.sh), which passes --env-file .env.prod and the deployed tag.

name: chathub-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-db-connection: &db-connection "Host=postgres;Port=5432;Database=${POSTGRES_DB:-chathub};Username=${POSTGRES_USER:-chathub};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod};Gss Encryption Mode=Disable"
x-db-api-connection: &db-api-connection "Host=postgres;Port=5432;Database=${POSTGRES_DB:-chathub};Username=${POSTGRES_USER:-chathub};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod};Gss Encryption Mode=Disable;Maximum Pool Size=${DB_MAX_POOL_SIZE:-10};Max Auto Prepare=50"
x-notifications-db-connection: &notifications-db-connection "Host=postgres;Port=5432;Database=${NOTIFICATIONS_DB:-chathub_notifications};Username=${POSTGRES_USER:-chathub};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod};Gss Encryption Mode=Disable;Maximum Pool Size=${NOTIFICATIONS_DB_MAX_POOL_SIZE:-5}"

x-dotnet: &dotnet
  ASPNETCORE_ENVIRONMENT: Production
  DOTNET_gcServer: "0"
  DOTNET_GCConserveMemory: "5"

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-50}
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=160MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - wal_buffers=4MB
      - -c
      - max_wal_size=512MB
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - jit=off
      - -c
      - huge_pages=off
    shm_size: 64mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chathub}
      POSTGRES_USER: ${POSTGRES_USER:-chathub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 256M
    logging: *logging

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "32mb", "--maxmemory-policy", "volatile-lru"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    logging: *logging

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-chathub}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env.prod}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 1:1 +sbwt none +sbwtdcpu none +sbwtdio none"
    volumes:
      - rabbitmq:/var/lib/rabbitmq
      - ./deploy/rabbitmq/10-chathub.conf:/etc/rabbitmq/conf.d/10-chathub.conf:ro
    networks: [backend]
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/5672"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    logging: *logging

  migrator:
    image: ${CHATHUB_IMAGE_PREFIX:-ghcr.io/m7mhm}/chathub-migrator:${CHATHUB_TAG:-latest}
    environment:
      <<: *dotnet
      ConnectionStrings__DefaultConnection: *db-connection
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 256M
    logging: *logging

  notifications-migrator:
    image: ${CHATHUB_IMAGE_PREFIX:-ghcr.io/m7mhm}/chathub-notifications-migrator:${CHATHUB_TAG:-latest}
    environment:
      <<: *dotnet
      ConnectionStrings__Notifications: *notifications-db-connection
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 256M
    logging: *logging

  api:
    image: ${CHATHUB_IMAGE_PREFIX:-ghcr.io/m7mhm}/chathub-api:${CHATHUB_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *dotnet
      ConnectionStrings__DefaultConnection: *db-api-connection
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      Jwt__Secret: ${JWT_SECRET:?set JWT_SECRET in .env.prod}
      FileStorage__SigningKey: ${FILE_SIGNING_KEY:?set FILE_SIGNING_KEY in .env.prod}
      Https__RedirectEnabled: "false"
      ForwardedHeaders__KnownProxies__0: ${EDGE_PROXY_IP:-172.31.0.2}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:?set FRONTEND_ORIGIN in .env.prod}
      Cors__AllowedOrigins__1: ${FRONTEND_EXTRA_ORIGIN:-}
      App__PublicApiBaseUrl: https://${CHATHUB_HOST:?set CHATHUB_HOST in .env.prod}
      App__FrontendBaseUrl: ${FRONTEND_ORIGIN:?set FRONTEND_ORIGIN in .env.prod}
      OpenApi__Enabled: ${CHATHUB_DOCS_PUBLIC:-false}
      Diagnostics__ExposeInstanceId: ${EXPOSE_INSTANCE_ID:-false}
      Messaging__Enabled: "true"
      Messaging__Host: rabbitmq
      Messaging__User: ${RABBITMQ_USER:-chathub}
      Messaging__Password: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env.prod}
      EmailVerification__TokenLifetimeHours: ${EMAIL_VERIFICATION_TOKEN_LIFETIME_HOURS:-24}
      EmailVerification__MaxRequestsPerHour: ${EMAIL_VERIFICATION_MAX_REQUESTS_PER_HOUR:-3}
      PasswordReset__TokenLifetimeMinutes: ${PASSWORD_RESET_TOKEN_LIFETIME_MINUTES:-30}
      PasswordReset__MaxRequestsPerHour: ${PASSWORD_RESET_MAX_REQUESTS_PER_HOUR:-3}
      Username__ChangeCooldownDays: ${USERNAME_CHANGE_COOLDOWN_DAYS:-14}
      # Guest mode ("Continue as guest") and the demo bot.
      Guest__Enabled: ${GUEST_ENABLED:-true}
      Guest__LifetimeHours: ${GUEST_LIFETIME_HOURS:-24}
      Guest__MaxActive: ${GUEST_MAX_ACTIVE:-500}
      Guest__CreatePerIpPerHour: ${GUEST_CREATE_PER_IP_PER_HOUR:-5}
      Bot__Enabled: ${BOT_ENABLED:-true}
      RateLimiting__AuthStrictPermitLimit: ${RATE_LIMIT_AUTH_STRICT:-10}
    labels:
      chathub.config-fingerprint: ${CHATHUB_CONFIG_FINGERPRINT:-}
    volumes:
      - storage:/app/storage
    networks:
      backend: {}
      edge:
        aliases: [chathub-api]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    deploy:
      replicas: ${API_REPLICAS:-1}
      resources:
        limits:
          cpus: "0.90"
          memory: 256M
    logging: *logging

  notifications:
    image: ${CHATHUB_IMAGE_PREFIX:-ghcr.io/m7mhm}/chathub-notifications:${CHATHUB_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *dotnet
      ConnectionStrings__Notifications: *notifications-db-connection
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER:-chathub}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env.prod}
      Smtp__Host: ${SMTP_HOST:-smtp-relay.brevo.com}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Security: ${SMTP_SECURITY:-StartTls}
      Smtp__User: ${SMTP_USER:?set SMTP_USER in .env.prod}
      Smtp__Password: ${SMTP_PASSWORD:?set SMTP_PASSWORD in .env.prod}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS:?set SMTP_FROM_ADDRESS in .env.prod}
      Smtp__FromName: ${SMTP_FROM_NAME:-ChatHub}
      Notifications__AppBaseUrl: ${FRONTEND_ORIGIN:?set FRONTEND_ORIGIN in .env.prod}
      Notifications__DigestDelaySeconds: ${NOTIFICATIONS_DIGEST_DELAY_SECONDS:-120}
      Notifications__CooldownMinutes: ${NOTIFICATIONS_COOLDOWN_MINUTES:-15}
      Notifications__IncludePreview: ${NOTIFICATIONS_INCLUDE_PREVIEW:-true}
      Notifications__MaxEmailsPerMinute: ${NOTIFICATIONS_MAX_EMAILS_PER_MINUTE:-20}
      Notifications__MaxDigestsPerMinute: ${NOTIFICATIONS_MAX_DIGESTS_PER_MINUTE:-15}
      Notifications__MaxEmailsPerDay: ${NOTIFICATIONS_MAX_EMAILS_PER_DAY:-250}
      Notifications__MaxDigestsPerDay: ${NOTIFICATIONS_MAX_DIGESTS_PER_DAY:-200}
      Notifications__MaxEmailsPerRecipientPerHour: ${NOTIFICATIONS_MAX_EMAILS_PER_RECIPIENT_PER_HOUR:-4}
    networks: [backend, egress]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      notifications-migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 160M
    logging: *logging

networks:
  backend:
    internal: true
  egress: {}
  edge:
    name: ${EDGE_NETWORK:-edge}
    external: true

volumes:
  pgdata:
  rabbitmq:
  storage:
