version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /
      - /ChatHub.*
      - /tests/*
      - /tools/*
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
