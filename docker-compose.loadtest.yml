# Load-test override. Use together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.loadtest.yml up -d --scale api=1
# See loadtest/README.md and docs/PERFORMANCE.md.

services:
  postgres:
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-100}", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=top"]

  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      RateLimiting__AuthStrictPermitLimit: "1000000"
      RateLimiting__AuthSessionPermitLimit: "1000000"
      Caching__Enabled: ${CACHING_ENABLED:-true}
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  k6:
    image: grafana/k6:2.4.0
    profiles: ["loadtest"]
    networks: [chathub]
    working_dir: /loadtest
    volumes:
      - ./loadtest:/loadtest
    environment:
      BASE_URL: http://nginx:8080
    restart: "no"
